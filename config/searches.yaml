# Indeed searches run by `jobbot scan`. Results from all searches are merged and de-duplicated.
# Keys under `defaults` apply to every search unless the search overrides them.

defaults:
  max_pages: 2        # result pages per search (~15 jobs each)
  fromage: 3          # only jobs posted in the last N days (1, 3, 7, 14)
  sort: date          # date | relevance

searches:
  - name: java-india
    query: java developer
    location: India
  - name: sde-india
    query: software engineer
    location: India
  - name: backend-india
    query: backend developer
    location: India
  - name: devops-india
    query: devops engineer
    location: India
  - name: cloud-india
    query: cloud engineer
    location: India
  - name: remote-backend
    query: backend developer
    location: Remote
  - name: remote-devops
    query: devops engineer
    location: Remote
