[project]
name = "jobbot"
version = "0.1.0"
description = "Local-LLM job matcher and approve-before-submit auto-apply helper"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "typer>=0.12",
    "rich>=13.7",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
jobbot = "jobbot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: calls the local Ollama model (slow; run with -m llm)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
